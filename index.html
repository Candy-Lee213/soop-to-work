<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숲으로 출근</title>
<meta name="description" content="모리걸과 세미 정장, 그 사이의 한 벌">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숲으로 출근">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 흑백 기본, 포인트는 살구 핑크와 베이지 두 가지. 한 열짜리 모바일 화면, 하단 탭 다섯 개 */
  --ink:#222222; --paper:#ffffff; --sub:#666666; --mute:#767676;
  --line:#eeeeee; --band:#f7f7f7; --border:#d5d5d5; --ph1:#ededed; --ph2:#e3e3e3;
  --point:#e0a090; --point-ink:#a85b45; --beige:#f1eadb;
  /* 글자 크기: 11 탭 · 12 캡션 · 13 보조 · 15 본문 · 17 목록 제목 · 20 섹션 · 22 화면 제목 · 26 큰 제목 · 30 배너
     여백: 4 단위(4 8 12 16 20 24 32 40), 화면 좌우 여백은 20 */
  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--band);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit;caret-color:var(--point-ink)}
::selection{background:var(--beige);color:var(--ink)}
p{text-wrap:pretty}
h1,h2,h3{text-wrap:balance;line-height:1.35}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{max-width:100%;display:block}
#app{max-width:430px;min-height:100%;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;position:relative}
.view{flex:1;display:flex;flex-direction:column;padding-bottom:84px}
.view.notab{padding-bottom:0}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:20px;height:20px}.ic.xs{width:16px;height:16px}.ic.l{width:36px;height:36px}
.ic.fill{fill:currentColor}
.serif{font-family:var(--serif)}
.mute{color:var(--mute)}.sub{color:var(--sub)}.point{color:var(--point-ink)}

/* 머리 */
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;min-height:56px}
.top h1{font-family:var(--serif);font-size:22px;font-weight:500}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:20px;font-weight:600}
.logo img{width:32px;height:34px;object-fit:contain;mix-blend-mode:multiply}
.top .acts{display:flex;align-items:center;gap:16px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;min-height:56px}
.nav .t{font-size:15px;font-weight:500}
.nav .save{font-weight:700;color:var(--point-ink);min-height:40px;padding:0 7px}
.iconbtn{display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px}
.top .iconbtn{margin-right:-7px}

/* 하단 탭 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--paper);border-top:1px solid #e5e5e5;display:flex;padding:10px 8px calc(14px + env(safe-area-inset-bottom));z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}

/* 홈 배너 */
.hero{background:var(--ink);color:#fff;padding:32px 20px 24px;display:flex;flex-direction:column;gap:16px}
.week{display:flex}
.week span{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #6e6e6e;margin-left:-1px;font-family:var(--serif);font-size:15px}
.week span:first-child{margin-left:0}
.week span.on{background:var(--beige);color:var(--ink);border-color:var(--beige)}
.hero h2{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.35;text-wrap:balance}
.hero p{color:#c4c4c4;margin-top:8px}
.hero .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c4c4c4}
.hero .meta b{color:#fff;font-weight:500;display:flex;align-items:center;gap:2px}
.photo{background:var(--ph1) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:rgba(34,34,34,.45);font-size:12px;width:100%}
.hero .photo{aspect-ratio:342/410}
.hero .empty{border:1px dashed #6e6e6e;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}

/* 섹션 */
.sec{display:flex;align-items:center;gap:4px;padding:32px 20px 16px;font-size:20px;font-weight:700}
.sec .r{margin-left:auto;font-size:13px;font-weight:400;color:var(--mute)}
.band{height:8px;background:var(--band);margin-top:24px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:none;width:150px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4}
.card .photo{aspect-ratio:3/4}
.card small{font-size:12px;color:var(--mute)}
.day{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.day .photo{width:64px;height:86px}
.day.today{color:var(--ink);font-weight:700}
.day.today .photo{background:#fff;border:1px dashed var(--ink);color:var(--ink)}
.list{padding:0 20px 24px}
.item{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line);align-items:center;width:100%}
.item:first-child{border-top:0}
.item .num{font-family:var(--serif);font-size:26px;line-height:1.1;align-self:flex-start;min-width:22px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .k{font-size:12px;color:var(--mute)}
.item .k.on{color:var(--point-ink);font-weight:700}
.item .t{font-size:17px;font-weight:300;line-height:1.4}
.item .d{font-size:13px;color:var(--sub)}
.item .photo{flex:none;width:72px;height:90px}
.item .photo.sq{width:64px;height:64px}

/* 버튼, 칩 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border:1px solid var(--border);font-weight:500;background:#fff;text-decoration:none}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:46px}
.chips{display:flex;flex-wrap:wrap;gap:8px 8px}
.chip{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:15px;background:#fff}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.off{opacity:.45}

/* 상세 */
.detail .photo{aspect-ratio:390/470}
.pad{padding:24px 20px 8px;display:flex;flex-direction:column;gap:8px}
.pad h2{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.35;text-wrap:balance}
.steps{padding:0 20px}
.step{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .k{font-family:var(--serif);font-size:20px;line-height:1.2}
.step .t{font-size:17px;font-weight:300;line-height:1.4}
.step .d{font-size:13px;color:var(--sub)}
.bal{padding:20px 20px 24px;display:flex;flex-direction:column;gap:12px}
.bal .h{display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.bal .h span{font-family:var(--serif);font-weight:400}
.bal .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--point) var(--p,50%),var(--border) var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;background:var(--border)}
input[type=range]::-moz-range-progress{height:2px;background:var(--point)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--point);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--point)}
.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;margin-top:auto}
.bottom .btn.solid{flex:1}

/* 발견 */
.search{margin:12px 20px 20px;height:48px;border-radius:24px;background:var(--band);display:flex;align-items:center;padding:0 20px;gap:8px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:16px} /* 16px 미만이면 아이폰이 입력할 때 화면을 확대한다 */
.search input::placeholder{color:var(--mute)}
.masonry{columns:2;column-gap:12px;padding:0 20px 24px}
.pin{break-inside:avoid;margin-bottom:12px;display:block;width:100%}
.pin .photo{min-height:120px}
.pin img{width:100%;background:var(--ph1)}
.emptybox{padding:56px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.emptybox h2{font-family:var(--serif);font-size:22px;font-weight:500}
.emptybox p{font-size:15px;color:var(--sub);line-height:1.6}
.emptybox img{width:112px;height:auto;margin-bottom:4px;mix-blend-mode:multiply}

/* 달력 */
.month{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 20px 0;font-family:var(--serif);font-size:17px;font-weight:500}
.month button[disabled]{color:var(--border)}
.stat{text-align:center;font-size:13px;color:var(--mute);padding-bottom:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:12px 3px;padding:0 12px}
.cal .w{text-align:center;font-size:12px;line-height:22px;color:var(--mute)}
/* 날짜는 칸 위에 작게, 사진 칸은 가리는 것 없이 세로로 길게 */
.cal button,.cal i{background:none;padding:0;font-style:normal;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);min-width:0}
.cal .dn{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;line-height:1;font-variant-numeric:tabular-nums}
.cal .tile{display:block;align-self:stretch;height:104px;border-radius:6px;background:var(--band) center/cover no-repeat}
.cal i .tile{background-color:#fbfbfb}
.cal i.x{visibility:hidden}
.cal .has .dn{color:var(--ink)}
.cal .tile.cut{background-color:var(--band);background-size:contain;background-position:center bottom}
.cal .tile.nop{background-color:var(--ph2)}
.cal .now .dn{background:var(--ink);color:#fff;font-weight:600}
.hearts{display:flex;gap:4px;color:var(--border)}
.hearts .on{color:var(--point)}
.hearts button{display:flex}

/* 폼 */
.form{padding:8px 20px 20px;display:flex;flex-direction:column;gap:24px}
.drop{border:1px dashed var(--mute);background:var(--band) center/contain no-repeat;aspect-ratio:350/330;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:15px}
.drop.has{border-style:solid;border-color:var(--line);background-size:cover}
.two{display:flex;gap:8px;margin-top:8px}
.two>*{flex:1}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lb{font-size:15px;font-weight:500}
.field input[type=text],.field input[type=url]{border:0;border-bottom:1px solid var(--ink);padding:8px 0;font-size:17px;outline:none;border-radius:0;background:none;width:100%}
.field input.serif{font-family:var(--serif)}
.field small{font-size:12px;color:var(--mute)}
.check{display:flex;gap:12px;align-items:center;background:var(--beige);padding:12px 16px;width:100%}
.check .box{width:22px;height:22px;border:1px solid var(--mute);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.check.on .box{background:var(--point);border-color:var(--point)}
.check b{font-weight:500;display:block}
.check small{font-size:12px;color:var(--sub)}

/* 처음 */
.ob{flex:1;display:flex;flex-direction:column;padding:40px 20px 0;gap:16px}
.ob h2{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.35;text-wrap:balance}
.ob .n{font-family:var(--serif);font-size:15px;color:var(--mute)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border:1px solid var(--border);width:100%}
.opt.on{border:1.5px solid var(--ink);background:var(--beige)}
.opt b{font-family:var(--serif);font-size:17px;font-weight:500;display:block}
.opt small{font-size:13px;color:var(--sub)}
.opt .ic{color:var(--point);visibility:hidden}.opt.on .ic{visibility:visible}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px 20px}
.splash img{width:180px;height:auto;mix-blend-mode:multiply}
.splash h1{font-family:var(--serif);font-size:30px;font-weight:600}
.foot{padding:24px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:center}

/* 내 서랍 */
.quick{margin:12px 20px 0;border:1px solid var(--border);border-radius:10px;display:flex;padding:24px 0}
.quick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px}
.set{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--line);font-size:17px;font-weight:300;width:100%}
.set:first-child{border-top:0}
.set span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--mute)}

/* 시트, 알림 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:430px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;max-height:86%;overflow:auto}
.sheet h3{font-family:var(--serif);font-size:22px;font-weight:500}
.sheet p{font-size:15px;color:var(--sub);line-height:1.6}
.sheet ol{padding-left:20px;font-size:15px;color:var(--sub);line-height:1.7}
.cutting{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:8px 20px;background:var(--band)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;font-size:13px;z-index:60;max-width:90%;text-align:center}
.note{margin:0 20px;padding:10px 14px;background:var(--beige);font-size:12px;color:var(--sub)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div id="app"><div class="splash"><img src="leaf.jpg" alt=""><h1>숲으로 출근</h1><p class="sub">불러오는 중이에요</p></div></div>

<script>
"use strict";
/* ---------- 도구 ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const WD=['일','월','화','수','목','금','토'];
const longDate=d=>`${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
const today=()=>new Date();
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;};
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 내용 ---------- */
const FORMULAS=[
 {n:'①',t:'재킷은 그대로, 안을 숲으로',d:'블레이저 안에 잔꽃 원피스나 레이스 블라우스',k:'겹',steps:[['겉','어깨선이 잡힌 재킷은 그대로','재킷 하나가 단정함을 잡아 줘요'],['안','핀의 원피스나 블라우스를 안에','넉넉한 실루엣이 재킷 아래로 보이게'],['발','플랫 대신 로퍼','양말을 살짝 보이면 숲의 느낌이 남아요']]},

/* ---------- 상태와 저장: 이 기기의 IndexedDB ---------- */
const S={settings:{onboarded:false,balance:50,boardUrl:''},pins:[],records:{},daily:{},route:{name:'loading'},stack:[],form:null,sheet:null,cutting:new Set(),q:'',tag:'전체',cal:null,busy:false};
const DB_NAME='soop-to-work',DB_VER=1;let idb=null;const URLS=new Map();
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const q=fn(t.objectStore(store));let out;if(q)q.onsuccess=()=>{out=q.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const blobPut=(id,b)=>tx('blobs','readwrite',s=>s.put(b,id));
const blobDel=id=>tx('blobs','readwrite',s=>s.delete(id));
const blobGet=id=>tx('blobs','readonly',s=>s.get(id));
const KEY={app:'settings',pins:'pins',records:'records',daily:'daily'};
const snapshot=k=>JSON.parse(JSON.stringify(k==='settings'?S.settings:S[k]));
async function write(path){const k=KEY[path.split('/')[0]];await kvSet(k,snapshot(k));}
const remove=write;
async function loadAll(){
  idb=await openDB();
  const [st,pins,recs,daily,keys]=await Promise.all([kvGet('settings'),kvGet('pins'),kvGet('records'),kvGet('daily'),tx('blobs','readonly',s=>s.getAllKeys())]);
  if(st)Object.assign(S.settings,st);S.pins=pins||[];S.records=recs||{};S.daily=daily||{};
  for(const id of keys||[]){const b=await blobGet(id);if(b)URLS.set(id,URL.createObjectURL(b));}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}
}
const src=o=>o?(o.imgId?(URLS.get(o.imgId)||o.remote||''):(o.remote||'')):'';
const cutSrc=o=>o&&o.cutImgId?(URLS.get(o.cutImgId)||''):'';
const bg=o=>{const u=src(o);return u?` style="background-image:url('${esc(u)}')"`:'';};
/* 기록 썸네일: 누끼 사진이 있으면 그것을, 없으면 원래 사진을 */
const tbg=o=>{const c=cutSrc(o);return c?` style="background-image:url('${esc(c)}');background-color:var(--band);background-size:contain;background-position:center bottom"`:bg(o);};
const tcls=o=>cutSrc(o)?'cut':'';
async function shrink(file,max=1400){
  const url=URL.createObjectURL(file);
  try{const img=await loadImg(url);
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.86));
    return {blob,preview:c.toDataURL('image/jpeg',0.6),ratio:c.width/c.height};
  }finally{URL.revokeObjectURL(url);}
}
async function storeBlob(blob){const id=uid();await blobPut(id,blob);URLS.set(id,URL.createObjectURL(blob));return id;}
async function dropBlob(id){if(!id)return;try{await blobDel(id);}catch(e){}const u=URLS.get(id);if(u){URL.revokeObjectURL(u);URLS.delete(id);}}
async function storeImage(f){return {imgId:await storeBlob(f.blob)};}
async function dropImage(o){if(o)await dropBlob(o.imgId);}
async function dropCut(o){if(o)await dropBlob(o.cutImgId);}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}

/* ---------- 누끼: 브라우저 안에서 배경 지우기 (@imgly/background-removal) ----------
   처음 한 번 모델 파일을 내려받고, 이후에는 브라우저가 보관한 것을 쓴다 */
const BG_LIBS=['https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm','https://esm.sh/@imgly/background-removal@1.7.0'];
let bgP=null;
function loadBG(){
  if(bgP)return bgP;
  bgP=(async()=>{let err;for(const u of BG_LIBS){try{const m=await import(u);const f=m.removeBackground||m.default;if(typeof f==='function')return f;}catch(e){err=e;console.warn('bg lib',u,e);}}throw err||new Error('no lib');})();
  bgP.catch(()=>{bgP=null;});return bgP;
}
async function trimPng(blob){
  const url=URL.createObjectURL(blob);
  try{const img=await loadImg(url);const W=img.naturalWidth,H=img.naturalHeight;
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0);
    const d=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;
    for(let y=0;y<H;y++)for(let i=0;i<W;i++){if(d[(y*W+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1<0||(x1-x0)*(y1-y0)<W*H*.02)throw new Error('no person');
    const pad=Math.round(Math.max(x1-x0,y1-y0)*.03);const ox=Math.max(0,x0-pad),oy=Math.max(0,y0-pad),ow=Math.min(W,x1+pad+1)-ox,oh=Math.min(H,y1+pad+1)-oy;
    const o=document.createElement('canvas');o.width=ow;o.height=oh;o.getContext('2d').drawImage(c,ox,oy,ow,oh,0,0,ow,oh);
    return await new Promise(res=>o.toBlob(res,'image/png'));
  }finally{URL.revokeObjectURL(url);}
}
async function cutPerson(blob){const removeBg=await loadBG();const out=await removeBg(blob,{output:{format:'image/png'}});return await trimPng(out);}
async function runCut(date,blob){
  if(S.cutting.has(date))return;S.cutting.add(date);render();
  try{
    if(!blob){const r=S.records[date];if(!r||!r.imgId)throw new Error('no photo');blob=await blobGet(r.imgId);}
    const png=await cutPerson(blob);
    const r=S.records[date];if(!r)return;
    const old=r.cutImgId;r.cutImgId=await storeBlob(png);
    await write('records/'+date);await dropBlob(old);
    toast('사진 달력에 인물만 올렸어요');
  }catch(e){console.warn('cut',e);toast(navigator.onLine===false?'인터넷에 연결되면 인물만 따 드릴게요':'인물만 따지 못해 원래 사진으로 둘게요');}
  finally{S.cutting.delete(date);render();}
}

/* ---------- 핀터레스트 보드 자동 등록 ----------
   매일 아침 예약 작업이 보드의 핀 목록을 pins.json에 올린다.
   앱을 열 때 새 핀만 받아 이 기기에 담고, 지운 핀은 다시 담지 않는다 */
const PINIMG='https://i.pinimg.com/';
async function fetchPinBlob(path){for(const size of ['736x','originals']){try{const r=await fetch(PINIMG+size+'/'+path,{mode:'cors'});if(r.ok)return await r.blob();}catch(e){}}throw new Error('pin fetch');}
async function syncBoard(){
  if(navigator.onLine===false)return;
  let data;try{const r=await fetch('pins.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;data=await r.json();}catch(e){return;}
  const have=new Set(S.pins.map(p=>p.pinPath).filter(Boolean)),removed=new Set(S.settings.removedPins||[]);
  const todo=(data.pins||[]).filter(x=>x&&x.path&&!have.has(x.path)&&!removed.has(x.path));
  if(!todo.length)return;
  let n=0;const base=Date.now();
  for(let i=todo.length-1;i>=0;i--){const x=todo[i];
    const remote=PINIMG+'736x/'+x.path;let imgId=null,ratio=0.75;
    /* 이미지 파일을 기기에 받아 두고, 서버가 허락하지 않으면 핀터레스트 주소로 바로 보여 준다 */
    try{const b=await fetchPinBlob(x.path);const url=URL.createObjectURL(b);try{const im=await loadImg(url);ratio=Math.round(im.naturalWidth/im.naturalHeight*1000)/1000;}catch(e){}URL.revokeObjectURL(url);imgId=await storeBlob(b);}
    catch(e){try{const im=await loadImg(remote);ratio=Math.round(im.naturalWidth/im.naturalHeight*1000)/1000;}catch(e2){console.warn('board pin',x.path,e2);continue;}}
    S.pins.push({id:uid(),createdAt:base+(todo.length-i),saved:false,title:'',link:data.board||'',tags:[],ratio,imgId,remote,pinPath:x.path,from:'board'});n++;}
  if(!n)return;
  S.pins.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));await write('pins');render();toast(`보드에서 새 핀 ${n}장을 담았어요`);
}

/* ---------- 백업 ---------- */
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});
async function exportBackup(){
  const ids=new Set();S.pins.forEach(p=>p.imgId&&ids.add(p.imgId));Object.values(S.records).forEach(r=>{r.imgId&&ids.add(r.imgId);r.cutImgId&&ids.add(r.cutImgId);});
  const images={};for(const id of ids){const b=await blobGet(id);if(b)images[id]=await blobToDataUrl(b);}
  const data={app:'soop-to-work',version:1,exportedAt:new Date().toISOString(),settings:S.settings,pins:S.pins,records:S.records,daily:S.daily,images};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=`숲으로출근-백업-${dkey(today())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('백업 파일을 내려받았어요');
}
async function importBackup(file){
  let data;try{data=JSON.parse(await file.text());}catch(e){toast('백업 파일을 읽지 못했어요');return;}
  if(!data||data.app!=='soop-to-work'){toast('숲으로 출근 백업 파일이 아니에요');return;}
  S.sheet={type:'confirm',title:'백업으로 바꿀까요?',text:'지금 이 기기에 있는 핀과 기록이 백업 파일의 내용으로 바뀌어요.',yesLabel:'바꾸기',yes:async()=>{
    S.sheet=null;render();toast('백업을 불러오는 중이에요');
    try{await tx('blobs','readwrite',s=>s.clear());
      for(const [id,du] of Object.entries(data.images||{})){const b=await (await fetch(du)).blob();await blobPut(id,b);}
      await kvSet('settings',data.settings||{});await kvSet('pins',data.pins||[]);await kvSet('records',data.records||{});await kvSet('daily',data.daily||{});
      location.reload();
    }catch(e){console.error(e);toast('백업을 불러오지 못했어요');}
  }};render();
}

/* ---------- 오늘의 제안 ---------- */
const pinById=id=>S.pins.find(p=>p.id===id);
const pinTitle=p=>p.title||((p.tags||[]).slice(0,2).join(', '))||'제목 없는 핀';
function baseBalance(d){const w=d.getDay();return clamp(S.settings.balance+(w===1?-10:w===5?10:0),20,80);}
function formulaFor(k,bal){const set=bal<=35?[1,4]:bal>=65?[2,3]:[0,3];return set[hash(k)%2];}
function pick(k,skip){
  if(!S.pins.length)return null;
  const recent=new Set();const d0=fromKey(k);for(let i=1;i<=7;i++){const d=new Date(d0);d.setDate(d.getDate()-i);const x=S.daily[dkey(d)];if(x)recent.add(x.pinId);}
  let pool=S.pins.filter(p=>!recent.has(p.id)&&p.id!==skip);if(!pool.length)pool=S.pins.filter(p=>p.id!==skip);if(!pool.length)pool=S.pins;
  return pool[(hash(k)+(skip?hash(skip):0))%pool.length];
}
function todayPlan(create=true){
  const k=dkey(today());let d=S.daily[k];
  if(d&&pinById(d.pinId))return d;
  if(!create||!S.pins.length)return null;
  const p=pick(k);d={pinId:p.id,balance:baseBalance(today()),chosen:false};S.daily[k]=d;write('daily/'+k,d).catch(()=>{});return d;
}

function vCalendar(){
  const t=today();if(!S.cal)S.cal={y:t.getFullYear(),m:t.getMonth()};const {y,m}=S.cal;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),tk=dkey(t);
  const isCur=y===t.getFullYear()&&m===t.getMonth();
  const keys=Object.keys(S.records).filter(k=>k.startsWith(`${y}-${pad(m+1)}-`));
  let cells='';for(let i=0;i<first;i++)cells+='<i class="x" aria-hidden="true"><span class="dn">0</span><span class="tile"></span></i>';
  for(let d=1;d<=days;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,r=S.records[k],fut=k>tk;
    if(r)cells+=`<button class="has ${k===tk?'now':''}" data-act="rec" data-date="${k}" aria-label="${m+1}월 ${d}일 기록 보기"><span class="dn">${d}</span><span class="tile ${src(r)?tcls(r):'nop'}"${tbg(r)}></span></button>`;
    else if(fut)cells+=`<i><span class="dn">${d}</span><span class="tile"></span></i>`;
    else cells+=`<button class="${k===tk?'now':''}" data-act="rec-new" data-date="${k}" aria-label="${m+1}월 ${d}일 기록하기"><span class="dn">${d}</span><span class="tile"></span></button>`;}
  const past=Object.keys(S.records).sort().reverse().slice(0,10);
  return `<div class="view">
  <header class="top"><h1>기록</h1><button class="iconbtn" data-act="rec-new" data-date="${tk}" aria-label="오늘 기록하기">${ic('cam')}</button></header>
  <div class="month"><button class="iconbtn" data-act="mon" data-d="-1" aria-label="이전 달">${ic('back','s')}</button><span>${y}년 ${m+1}월</span><button class="iconbtn" data-act="mon" data-d="1" aria-label="다음 달"${isCur?' disabled':''}>${ic('next','s')}</button></div>
  ${[...S.cutting].some(k=>k.startsWith(`${y}-${pad(m+1)}-`))?'<p class="cutting" style="margin:0 16px 12px">사진에서 인물만 따는 중이에요…</p>':''}<p class="stat">${keys.length?`이번 달 ${keys.length}일 기록 · 아주 좋았던 날 ${keys.filter(k=>S.records[k].hearts===3).length}일`:'이 달에는 아직 기록이 없어요'}</p>
  <div class="cal">${WD.map(w=>`<span class="w">${w}</span>`).join('')}${cells}</div>
  <div style="padding:20px 20px 0"><button class="btn solid full" data-act="${S.records[tk]?'rec':'rec-new'}" data-date="${tk}">${ic('cam','s')} ${S.records[tk]?'오늘 기록 보기':'오늘 입은 옷 기록하기'}</button></div>
  ${note()?'<div style="height:16px"></div>'+note():''}
  <div class="band"></div><h2 class="sec">지난 기록</h2>
  <div class="list">${past.length?past.map(k=>{const r=S.records[k];return `<button class="item" data-act="rec" data-date="${k}"><span class="tx"><span class="k">${longDate(fromKey(k))}</span><span class="t">${esc(recTitle(r))}</span><span style="display:flex;gap:8px;align-items:center">${hearts(r.hearts||0,'xs')}${r.balance?`<span class="serif mute" style="font-size:12px">숲 ${r.balance} : 정장 ${100-r.balance}</span>`:''}</span></span><span class="photo"${tbg(r)}></span></button>`;}).join(''):'<p class="sub" style="font-size:15px">첫 기록을 남기면 여기에 쌓여요.</p>'}</div>
  </div>${tabbar('calendar')}`;

   <button class="set" data-act="sheet" data-s="board">핀터레스트 보드<span>${S.settings.boardUrl?'<b class="point" style="font-weight:500">주소 저장됨</b>':'없음'} ${ic('next','xs')}</span></button>
   <button class="set" data-act="sheet" data-s="balance">평소 밸런스<span>숲 ${b} : 정장 ${100-b} ${ic('next','xs')}</span></button>
   <button class="set" data-act="sheet" data-s="install">홈 화면에 추가하는 법<span>${ic('next','xs')}</span></button>
  </div>
  <div class="band" style="margin-top:4px"></div><h2 class="sec">백업</h2>
  <p class="sub" style="padding:0 20px 8px;font-size:13px;line-height:1.6">핀과 기록은 이 휴대폰에만 저장돼요. 브라우저 데이터를 지우거나 휴대폰을 바꾸면 사라지니, 가끔 백업 파일을 내려받아 두세요.</p>
  <div class="list">
   <button class="set" data-act="backup-out">백업 파일 내려받기<span>${ic('next','xs')}</span></button>
   <label class="set" style="cursor:pointer">백업 파일 불러오기<span>${ic('next','xs')}</span><input type="file" id="f-backup" accept="application/json,.json" hidden></label>
  </div>
  </div>${tabbar('drawer')}`;
}

const BAL=[[30,'숲 30 : 정장 70','단정함이 먼저. 색과 소품만 숲으로'],[50,'숲 50 : 정장 50','재킷에 원피스처럼, 큰 옷 하나씩 섞기'],[70,'숲 70 : 정장 30','가디건과 롱스커트에 로퍼 하나']];
const balOpts=cur=>BAL.map(([v,t,d])=>`<button class="opt ${cur===v?'on':''}" data-act="set-bal" data-v="${v}" aria-pressed="${cur===v}"><span><b>${t}</b><small>${d}</small></span>${ic('check')}</button>`).join('');
function vOnboard(){
  const st=S.route.step||0;
  if(st===0)return `<div class="view notab"><div class="splash"><img src="leaf.jpg" alt=""><h1>숲으로 출근</h1><p class="sub">모리걸과 세미 정장,<br>그 사이의 한 벌</p></div><div class="foot"><button class="btn solid full" data-act="ob" data-step="1">시작하기</button><span class="mute" style="font-size:12px">혼자 쓰는 옷 일기</span></div></div>`;
  if(st===1)return `<div class="view notab"><div class="ob"><span class="n">1 / 2</span><h2>영감을 모으는<br>핀터레스트 보드를<br>알려 주세요</h2><p class="sub" style="font-size:15px">보드로 바로 가는 길을 만들어 둘게요. 핀 사진은 발견 탭에서 직접 올리면 홈과 발견에 나타나요.</p>
    <div class="field" style="padding-top:20px"><label for="ob-url" class="mute" style="font-size:12px;font-weight:400">보드 주소</label><input type="url" id="ob-url" data-s="boardUrl" value="${esc(S.settings.boardUrl)}" placeholder="https://pin.it/…" inputmode="url"><small>나중에 내 서랍에서 바꿀 수 있어요.</small></div></div>
    <div class="foot"><button class="btn solid full" data-act="ob" data-step="2">다음</button></div></div>`;
  return `<div class="view notab"><div class="ob"><span class="n">2 / 2</span><h2>평소엔 어느 쪽에<br>가깝게 입고 싶나요?</h2><p class="sub" style="font-size:15px">매일의 제안이 이 비율을 기준으로 만들어져요. 언제든 바꿀 수 있어요.</p><div style="display:flex;flex-direction:column;gap:12px;padding-top:16px">${balOpts(S.settings.balance)}</div></div>
    <div class="foot"><button class="btn solid full" data-act="ob-done">숲으로 출근하기</button></div></div>`;
}

function vSheet(){
  const s=S.sheet;if(!s)return '';let body='';
  if(s.type==='balance')body=`<h3>평소 밸런스</h3><p>월요일은 정장 쪽으로, 금요일은 숲 쪽으로 조금씩 옮겨서 제안해요.</p>${balOpts(S.settings.balance)}<button class="btn solid full" data-act="sheet-close">닫기</button>`;
  else if(s.type==='board')body=`<h3>핀터레스트 보드</h3><div class="field"><label for="sh-url">보드 주소</label><input type="url" id="sh-url" value="${esc(S.settings.boardUrl)}" placeholder="https://pin.it/…" inputmode="url"></div>${S.settings.boardUrl?`<a class="btn" href="${esc(S.settings.boardUrl)}" target="_blank" rel="noopener">보드 열기 ${ic('link','s')}</a>`:''}<button class="btn solid full" data-act="board-save">저장</button>`;
  else if(s.type==='install')body=`<h3>홈 화면에 추가하는 법</h3><ol><li>이 화면을 Safari에서 엽니다.</li><li>아래 공유 버튼을 누릅니다.</li><li>‘홈 화면에 추가’를 고릅니다.</li></ol><p>홈 화면에 잎 단추 아이콘이 생기고, 앱처럼 주소창 없이 열려요.</p><button class="btn solid full" data-act="sheet-close">닫기</button>`;
  else if(s.type==='confirm')body=`<h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><div class="two"><button class="btn" data-act="sheet-close">그만두기</button><button class="btn solid" data-act="confirm-yes">${esc(s.yesLabel||'지우기')}</button></div>`;
  return `<div class="dim" data-act="sheet-dim"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}

function render(){
  const r=S.route;let h='';
  switch(r.name){
    case 'onboard':h=vOnboard();break;case 'home':h=vHome();break;case 'suggest':h=vSuggest();break;
    case 'discover':h=vDiscover();break;case 'pin':h=vPin(pinById(r.id));break;case 'pinform':h=vPinForm();break;
    case 'closet':h=vCloset();break;case 'calendar':h=vCalendar();break;case 'recform':h=vRecForm();break;case 'rec':h=vRec();break;
    case 'drawer':h=vDrawer();break;default:h=vHome();}
  $app.innerHTML=h+vSheet();
}

/* ---------- 동작 ---------- */
const fail=e=>{console.error(e);S.busy=false;render();toast(e&&e.name==='QuotaExceededError'?'휴대폰 저장 공간이 부족해요. 오래된 핀이나 기록을 지워 주세요.':'저장하지 못했어요. 잠시 뒤 다시 해 주세요.');};
async function savePin(p){const i=S.pins.findIndex(x=>x.id===p.id);if(i<0)S.pins.unshift(p);else S.pins[i]=p;await write('pins/'+p.id,p);}
function newPinForm(pin){S.form=pin?{id:pin.id,title:pin.title||'',link:pin.link||'',tags:[...(pin.tags||[])],preview:src(pin),img:null}:{title:'',link:'',tags:[],preview:'',img:null};go('pinform');}
function newRecForm(date){const r=S.records[date],plan=S.daily[date];S.form=r?{date,hearts:r.hearts||0,memo:r.memo||'',items:[...(r.items||[])],followed:!!r.followed,preview:src(r),img:null}:{date,hearts:2,memo:'',items:[],followed:!!(plan&&plan.chosen),preview:'',img:null};go('recform');}
const A={
  tab:e=>go(e.to),back:()=>back(),
  'open-today':()=>go('suggest'),
  pin:e=>go('pin',{id:e.id}),
  'pin-new':()=>newPinForm(null),'pin-edit':e=>newPinForm(pinById(e.id)),
  'pin-save':async e=>{const p=pinById(e.id);if(!p)return;p.saved=!p.saved;render();toast(p.saved?'내 서랍에 저장했어요':'저장을 풀었어요');try{await write('pins/'+p.id,p);}catch(x){fail(x);}},
  'pin-del':e=>{S.sheet={type:'confirm',title:'이 핀을 지울까요?',text:'지운 핀은 되돌릴 수 없어요.',yes:async()=>{const p=pinById(e.id);S.pins=S.pins.filter(x=>x.id!==e.id);if(p&&p.pinPath){S.settings.removedPins=[...new Set([...(S.settings.removedPins||[]),p.pinPath])];await write('app/settings');}S.sheet=null;back();try{await remove('pins/'+e.id);await dropImage(p);}catch(x){fail(x);}toast('핀을 지웠어요');}};render();},
  'pin-today':async e=>{const k=dkey(today());S.daily[k]={pinId:e.id,balance:(S.daily[k]&&S.daily[k].balance)||baseBalance(today()),chosen:false};S.stack=[{name:'home'}];S.route={name:'suggest'};render();window.scrollTo(0,0);try{await write('daily/'+k,S.daily[k]);}catch(x){fail(x);}},
  ftag:e=>{const t=S.form.tags,i=t.indexOf(e.tag);i<0?t.push(e.tag):t.splice(i,1);render();},
  fitem:e=>{const t=S.form.items,i=t.indexOf(e.tag);i<0?t.push(e.tag):t.splice(i,1);render();},
  'pin-submit':async()=>{const f=S.form;if(S.busy)return;if(!f.id&&!f.img){toast('사진을 먼저 골라 주세요');return;}
    S.busy=true;render();try{const old=f.id?pinById(f.id):null;let p=old?{...old}:{id:uid(),createdAt:Date.now(),saved:false};
      if(f.img){const im=await storeImage(f.img);if(old)await dropImage(old);delete p.assetId;delete p.dataUrl;delete p._url;Object.assign(p,im,{ratio:Math.round(f.img.ratio*1000)/1000});}
      p.title=f.title.trim();p.link=f.link.trim();p.tags=f.tags;await savePin(p);S.busy=false;S.form=null;back();toast(old?'핀을 고쳤어요':'보드에 담았어요');}catch(x){fail(x);}},
  tag:e=>{S.tag=e.tag;render();},
  saved:()=>{S.tag='저장한 핀';S.q='';go('discover');},
  another:async()=>{const k=dkey(today()),d=S.daily[k];if(S.pins.length<2){toast('핀이 하나뿐이에요. 발견에서 더 올려 주세요');return;}const p=pick(k,d.pinId);d.pinId=p.id;d.chosen=false;render();window.scrollTo(0,0);try{await write('daily/'+k,d);}catch(x){fail(x);}},
  choose:async()=>{const k=dkey(today()),d=S.daily[k];d.chosen=!d.chosen;render();toast(d.chosen?'좋아요. 저녁에 사진으로 남겨 보세요':'선택을 풀었어요');try{await write('daily/'+k,d);}catch(x){fail(x);}},
  mon:e=>{let {y,m}=S.cal;m+=Number(e.d);if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.cal={y,m};render();},
  rec:e=>go('rec',{date:e.date}),'rec-new':e=>newRecForm(e.date),'rec-edit':e=>newRecForm(e.date),
  heart:e=>{S.form.hearts=Number(e.n);render();},followed:()=>{S.form.followed=!S.form.followed;render();},
  'rec-submit':async()=>{const f=S.form;if(S.busy)return;S.busy=true;render();
    try{const old=S.records[f.date],plan=S.daily[f.date];let r=old?{...old}:{createdAt:Date.now()};
      const newPhoto=f.img;
      if(f.img){const im=await storeImage(f.img);if(old){await dropImage(old);await dropCut(old);}delete r.assetId;delete r.dataUrl;delete r._url;delete r.cutImgId;Object.assign(r,im);}
      Object.assign(r,{hearts:f.hearts,memo:f.memo.trim(),items:f.items,followed:f.followed});
      if(plan&&!old){r.pinId=plan.pinId;r.balance=plan.balance;r.formula=formulaFor(f.date,plan.balance);}
      S.records[f.date]=r;await write('records/'+f.date,r);S.busy=false;S.form=null;S.stack=S.stack.filter(x=>x.name!=='rec');S.route={name:'rec',date:f.date};if(!S.stack.length)S.stack=[{name:'calendar'}];render();window.scrollTo(0,0);toast('달력에 남겼어요');if(newPhoto)runCut(f.date,newPhoto.blob);}catch(x){fail(x);}},
  recut:e=>runCut(e.date,null),
  'rec-del':e=>{S.sheet={type:'confirm',title:'이 기록을 지울까요?',text:'사진과 메모가 함께 지워져요.',yes:async()=>{const r=S.records[e.date];delete S.records[e.date];S.sheet=null;back();try{await remove('records/'+e.date);await dropImage(r);await dropCut(r);}catch(x){fail(x);}toast('기록을 지웠어요');}};render();},
  sheet:e=>{S.sheet={type:e.s};render();},'sheet-close':()=>{S.sheet=null;render();},
  'sheet-dim':(e,ev)=>{if(ev.target.classList.contains('dim')){S.sheet=null;render();}},
  'confirm-yes':()=>S.sheet&&S.sheet.yes&&S.sheet.yes(),
  'set-bal':async e=>{S.settings.balance=Number(e.v);render();try{await write('app/settings',S.settings);}catch(x){fail(x);}},
  'board-save':async()=>{S.settings.boardUrl=(document.getElementById('sh-url').value||'').trim();S.sheet=null;render();toast('보드 주소를 저장했어요');try{await write('app/settings',S.settings);}catch(x){fail(x);}},
  ob:e=>{S.route={name:'onboard',step:Number(e.step)};render();window.scrollTo(0,0);},
  'backup-out':()=>exportBackup().catch(e=>{console.error(e);toast('백업 파일을 만들지 못했어요');}),
  'ob-done':async()=>{S.settings.onboarded=true;S.stack=[];S.route={name:'home'};render();try{await write('app/settings',S.settings);}catch(x){fail(x);}syncBoard();}
};
$app.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const a=A[el.dataset.act];if(a&&el.tagName!=='INPUT')a(el.dataset,ev);});
$app.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  else if(t.dataset.f&&S.form)S.form[t.dataset.f]=t.value;
  else if(t.dataset.s)S.settings[t.dataset.s]=t.value.trim();
  else if(t.id==='bal'){const formal=Number(t.value);t.style.setProperty('--p',(formal-20)/60*100+'%');document.getElementById('balv').textContent=`숲 ${100-formal} : 정장 ${formal}`;}
});
$app.addEventListener('change',async ev=>{const t=ev.target;
  if(t.id==='bal'){const k=dkey(today()),d=S.daily[k];d.balance=100-Number(t.value);render();try{await write('daily/'+k,d);}catch(x){fail(x);}}
  else if((t.id==='f-photo'||t.id==='f-cam')&&t.files&&t.files[0]&&S.form){try{const im=await shrink(t.files[0]);S.form.img=im;S.form.preview=im.preview;render();}catch(e){toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요');}}
  else if(t.id==='f-backup'&&t.files&&t.files[0]){const f=t.files[0];t.value='';importBackup(f);}
  else if(t.id==='f-many'&&t.files&&t.files.length){const files=[...t.files].slice(0,20);let ok=0;toast(`${files.length}장을 올리는 중이에요`);
    for(const f of files){try{const im=await shrink(f);const st=await storeImage(im);await savePin({id:uid(),createdAt:Date.now(),saved:false,title:'',link:'',tags:[],ratio:Math.round(im.ratio*1000)/1000,...st});ok++;render();}catch(e){console.error(e);}}
    toast(ok===files.length?`${ok}장을 보드에 담았어요`:`${ok}장을 담았고 ${files.length-ok}장은 올리지 못했어요`);}
});
window.addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(TABS.some(t=>t[0]===n)&&S.route.name!==n&&S.settings.onboarded)go(n);});

if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));}
(async function start(){
  try{await loadAll();}catch(e){console.error(e);$app.innerHTML='<div class="emptybox"><h2>저장 공간을 열 수 없어요</h2><p>사파리의 개인정보 보호 브라우징을 끄고 다시 열어 주세요.</p></div>';return;}
  const n=location.hash.slice(1);
  if(!S.settings.onboarded)S.route={name:'onboard',step:0};
  else S.route={name:TABS.some(t=>t[0]===n)?n:'home'};
  render();
  if(S.settings.onboarded)syncBoard();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.settings.onboarded)syncBoard();});
})();
</script>
</body>
</html>
